<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#160923">
  <meta name="robots" content="index,follow">
  <title>Wedding Invitation</title>
  <link rel="preload" as="image" href="https://myshaadhilink.in/assets/royal-premium/mandala-bloom.svg">
  <link rel="preload" as="image" href="https://myshaadhilink.in/assets/royal-premium/jali-pattern.svg">
  <link rel="stylesheet" href="./fonts.css">
  <link rel="stylesheet" href="./royal-premium-theme.css">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.addEventListener('error', function (event) {
      if (event && event.error) {
        const root = document.getElementById('app');
        if (root && !root.innerHTML.trim()) {
          root.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;background:#12091f;color:#f7ecd5;font:15px/1.6 system-ui,sans-serif;padding:24px;text-align:center"><div><h1 style="color:#f5d99d;margin:0 0 10px">Invitation failed to load</h1><p style="opacity:.82">Open Chrome DevTools → Console to see the exact error.</p><pre style="text-align:left;max-width:900px;white-space:pre-wrap;background:rgba(0,0,0,.2);padding:14px;border-radius:12px">' + String(event.error.stack || event.error.message || event.message || event) .replace(/[&<>]/g, function (c) { return ({"&":"&amp;","<":"&lt;",">":"&gt;"})[c]; }) + '</pre></div></div>';
        }
      }
    });
    window.addEventListener('unhandledrejection', function (event) {
      const root = document.getElementById('app');
      if (root && !root.innerHTML.trim()) {
        root.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;background:#12091f;color:#f7ecd5;font:15px/1.6 system-ui,sans-serif;padding:24px;text-align:center"><div><h1 style="color:#f5d99d;margin:0 0 10px">Invitation failed to load</h1><p style="opacity:.82">Open Chrome DevTools → Console to see the exact error.</p></div></div>';
      }
    });
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
